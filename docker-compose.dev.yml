# Development: postgres + frontend jalan di container. Backend dijalankan
# NATIVE di host (bukan container) — sama seperti pola master-scrape — karena
# backend butuh Playwright (download browser Chromium via apt-get) yang rawan
# gagal di dalam image Docker akibat isu GPG mirror APT yang intermiten.
#
# Cara pakai:
#   1. docker compose -f docker-compose.dev.yml up postgres frontend --build
#   2. Di terminal terpisah: cd backend && npm install && npx playwright install --with-deps chromium && npm run start:dev
#
# Tidak butuh .env — semua value punya default lewat ${VAR:-default} di bawah.
# Kalau ada .env di root (dipakai bareng docker-compose.yml production), variabel
# yang sama otomatis dipakai untuk override default dev ini juga.
#
# node_modules frontend sengaja pakai anonymous volume terpisah dari mount
# source code, supaya node_modules hasil `npm ci` di dalam image TIDAK
# tertimpa oleh node_modules di host (yang mungkin tidak ada / beda OS-arch).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ternak_sosmed}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_PUBLIC_BACKEND_AUTH_URL: http://localhost:4000
      VITE_PUBLIC_NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - postgres

volumes:
  postgres_dev_data:
  redis_dev_data:
  frontend_node_modules:
