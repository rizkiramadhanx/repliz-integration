services:
  traefik:
    image: traefik:v3.6.1
    restart: unless-stopped
    environment:
      # Docker Engine 29+ menaikkan minimum API version ke 1.44, sedangkan
      # Traefik <=3.5 memakai Docker SDK yang defaultnya masih 1.24 — akibatnya
      # Traefik gagal total konek ke docker.sock dan tidak pernah membaca label
      # container apa pun (gejalanya SEMUA domain balas 404 "page not found"
      # dari Traefik, bukan koneksi gagal, sehingga mudah dikira salah
      # network/label).
      #
      # Traefik 3.6.1 memperbaikinya dengan negosiasi versi API otomatis.
      # DOCKER_API_VERSION tetap dipasang sebagai jaring pengaman untuk daemon
      # yang tidak mendukung negosiasi; pada 3.5 env ini TIDAK berpengaruh
      # (terbukti errornya tetap muncul), jadi upgrade image-nya yang wajib.
      - DOCKER_API_VERSION=1.44
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ternak-sosmed-network
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - ternak-sosmed-network

networks:
  ternak-sosmed-network:
    name: ternak-sosmed-network
    external: true

volumes:
  traefik_letsencrypt:
