<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Ambil URL Konten</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #1a1c1e;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1b1e; color: #e9ecef; }
        textarea { background: #25262b; color: #e9ecef; border-color: #373a40; }
        .hint { color: #909296; }
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      .hint { font-size: 11px; color: #6b7280; margin: 0 0 10px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
      label { font-size: 12px; }
      input[type="number"] { width: 64px; padding: 4px 6px; }
      button {
        width: 100%; padding: 8px 10px; font-size: 13px; font-weight: 600;
        border: 0; border-radius: 6px; cursor: pointer;
        background: #1971c2; color: #fff;
      }
      button:disabled { opacity: .6; cursor: default; }
      button.secondary { background: #495057; margin-top: 6px; }
    button.danger { background: #c92a2a; margin-top: 6px; }
      textarea {
        width: 100%; box-sizing: border-box; height: 132px; margin-top: 10px;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 8px; border: 1px solid #dee2e6; border-radius: 6px; resize: vertical;
      }
      .status { font-size: 12px; margin-top: 8px; min-height: 16px; }
      .status.err { color: #e03131; }
      .status.ok { color: #2f9e44; }
    </style>
  </head>
  <body>
    <h1>Ambil URL Konten</h1>
    <p class="hint">
      Buka halaman profil TikTok / Instagram / Facebook, scroll secukupnya,
      lalu klik Ambil.
    </p>

    <div class="row">
      <label for="limit">Maksimal</label>
      <input type="number" id="limit" value="25" min="1" max="2000" />
      <label for="limit">URL</label>
    </div>

    <button id="grab">Ambil URL</button>
    <button id="stop" class="danger" disabled>Berhenti</button>
    <button id="copy" class="secondary" disabled>Salin ke clipboard</button>

    <div class="status" id="status"></div>
    <textarea id="out" placeholder="Hasil akan tampil di sini…" readonly></textarea>

    <script src="popup.js"></script>
  </body>
</html>
